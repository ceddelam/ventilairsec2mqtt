# Release on a version tag (v1.2.3): checks the versions, builds the app images with the Home
# Assistant builder actions (amd64 and aarch64 on native runners, multi-arch manifest on ghcr.io),
# then creates the GitHub release with the standalone archive.
name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ventilairsec2mqtt
  # Signing writes the repository and workflow identity to the public Sigstore log: keep it off
  # while the repository is private, turn it on when it goes public.
  COSIGN: 'false'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check versions, build the archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Versions and release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-check.mjs "$TAG" --notes release-notes.md
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund

      - run: npm run check

      - name: Standalone archive
        run: npm run pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          retention-days: 1

  init:
    name: Initialize image build
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [check, init]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Cosign keyless signing (when enabled)
      packages: write # Push to ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: .
          file: ventilairsec2mqtt/Dockerfile
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.check.outputs.version }}
            latest
          push: 'true'
          cosign: ${{ env.COSIGN }}
          skip-existing: ${{ needs.check.outputs.version }}
          version: ${{ needs.check.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Cosign keyless signing (when enabled)
      packages: write # Push to ghcr.io
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.check.outputs.version }}
            latest
          cosign: ${{ env.COSIGN }}
          skip-existing: ${{ needs.check.outputs.version }}

  release:
    name: GitHub release
    needs: [check, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the release with the standalone archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.tar.gz release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
